name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      - name: Smoke test
        run: dotnet run -c Release --project samples/ls-sample -- .

  alpine:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test (musl)
        run: dotnet run -c Release --project samples/ls-sample -- /usr

  publish:
    if: github.event_name == 'release'
    needs: [build, alpine]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for NuGet trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pack (version from release tag)
        run: dotnet pack src -c Release -o out -p:Version=${TAG#v}
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to NuGet
        run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
