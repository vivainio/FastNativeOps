name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      - name: Smoke test
        shell: bash
        run: |
          for f in net8.0 net10.0; do dotnet run -c Release -f $f --no-build --project samples/ls-sample -- . | head -3; done

      - name: Unit tests
        run: dotnet test tests/FastNativeOps.Tests -c Release

      - name: Backend check (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for fw in net8.0 net10.0; do
            scripts/check-backends.sh samples/ls-sample/bin/Release/$fw/ls-sample.dll /usr/bin /etc
            scripts/check-stat.sh samples/ls-sample/bin/Release/$fw/ls-sample.dll
          done

  publish:
    if: github.event_name == 'release'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for NuGet trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pack (version from release tag)
        run: dotnet pack src -c Release -o out -p:Version=${TAG#v}
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to NuGet
        run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
